name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Versions used for the paper (environment.yml), CPU build of PyTorch.
          - python: "3.9"
            torch: "1.10.1+cpu"
          - python: "3.10"
            torch: "1.13.1+cpu"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch==${{ matrix.torch }}" -f https://download.pytorch.org/whl/cpu/torch_stable.html
          pip install numpy==1.23.5 scipy==1.9.3 pylops==1.18.3 pyproximal==0.5.0 pytest ruff==0.17.1
          pip install -e . --no-deps
      - name: Lint
        run: ruff check pnpsvgd tests
      - name: Test
        run: pytest -q
